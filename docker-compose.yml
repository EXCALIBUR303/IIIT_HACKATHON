# Full stack for local demos: PostgreSQL + API + web.  Usage:
#   cp .env.example .env   # then edit values
#   docker compose up --build
#   open http://localhost:8080
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rupeerise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rupeerise}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rupeerise}"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      RUPEERISE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rupeerise}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rupeerise}
      RUPEERISE_ENV: ${RUPEERISE_ENV:-development}
      RUPEERISE_SECRET_KEY: ${RUPEERISE_SECRET_KEY:?set RUPEERISE_SECRET_KEY in .env}
      RUPEERISE_EDUCATOR_INVITE_CODE: ${RUPEERISE_EDUCATOR_INVITE_CODE:?set RUPEERISE_EDUCATOR_INVITE_CODE in .env}
      RUPEERISE_CORS_ORIGINS: '["http://localhost:8080"]'
      RUPEERISE_ANTHROPIC_API_KEY: ${RUPEERISE_ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
