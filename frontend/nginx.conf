# RupeeRise web server: serves the SPA and proxies /api to the backend.
#
# TLS: this container speaks plain HTTP on :80. In any real deployment terminate TLS in front
# of it (a load balancer, Caddy, Traefik or nginx with certificates) and forward
# X-Forwarded-Proto. Cookies are Secure in production, so sign-in does not work over HTTP there.
# See docs/deployment.md.

server_tokens off;

# Only send HSTS when the browser reached us over HTTPS (directly or via a TLS proxy).
map "$scheme:$http_x_forwarded_proto" $hsts {
  default "";
  "~^https:"  "max-age=63072000; includeSubDomains";
  "~:https$"  "max-age=63072000; includeSubDomains";
}

map $http_x_forwarded_proto $rr_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

# Coarse per-IP throttles in front of the app's own, finer, per-account limits.
limit_req_zone $binary_remote_addr zone=rr_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=rr_auth:10m rate=5r/s;
limit_req_status 429;

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/rupeerise/security-headers.conf;

  # Every body this API accepts is small JSON.
  client_max_body_size 64k;

  # Interactive API docs are for development. They are also disabled in the backend itself
  # in production; this keeps them unreachable through the public proxy either way.
  location ~ ^/api/(docs|redoc|openapi\.json) {
    return 404;
  }

  location /api/v1/auth/ {
    limit_req zone=rr_auth burst=10 nodelay;
    include /etc/nginx/rupeerise/proxy.conf;
    proxy_pass http://api:8000;
  }

  # API requests go to the backend container (docker-compose service "api").
  location /api/ {
    limit_req zone=rr_api burst=60 nodelay;
    include /etc/nginx/rupeerise/proxy.conf;
    proxy_pass http://api:8000;
  }

  # Hashed build assets are immutable.
  location /assets/ {
    include /etc/nginx/rupeerise/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html must never be cached for long, or users keep an old build.
  location = /index.html {
    include /etc/nginx/rupeerise/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  # Single-page app: unknown paths serve index.html (the router shows the 404 page).
  location / {
    try_files $uri /index.html;
  }
}
