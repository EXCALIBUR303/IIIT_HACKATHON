# Shared proxy settings for /api.
proxy_http_version 1.1;
proxy_set_header Host $host;
# Overwrite, never append: this nginx is the edge, so a client-supplied X-Forwarded-For must
# not reach the app, where it would let anyone pick the IP their rate limits are counted
# against. Behind another proxy, use the realip module so $remote_addr is the real client.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $rr_proto;
proxy_set_header X-Real-IP $remote_addr;
proxy_read_timeout 30s;
# Responses carry personal learning data and session cookies.
add_header Cache-Control "no-store" always;
include /etc/nginx/rupeerise/security-headers.conf;
