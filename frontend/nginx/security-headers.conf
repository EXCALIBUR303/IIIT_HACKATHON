# Included in every location that sets its own add_header (nginx does not inherit add_header
# into a location that declares any). Keep this file the single source for security headers.

# Content-Security-Policy: the app is a same-origin SPA. No third-party scripts, fonts or
# frames. 'unsafe-inline' is for style ATTRIBUTES only (React/animation libraries set inline
# styles); scripts stay strict.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# HSTS is only meaningful (and only sent) when the request arrived over HTTPS, either here or
# at a TLS-terminating proxy in front (X-Forwarded-Proto). See $hsts in nginx.conf.
add_header Strict-Transport-Security $hsts always;
